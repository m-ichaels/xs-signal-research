[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xsig"
version = "0.1.0"
description = "Cross-sectional ML signal research: how much of an equity signal survives honest validation, and whether it carries to ETFs and index futures"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "pyarrow", "scipy", "scikit-learn", "duckdb", "matplotlib", "fpdf2"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["xsig"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
